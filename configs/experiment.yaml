seed: 99
data:
  root_env: PATHSNAP_DATA_ROOT
  train_partition: train
  development_partition: student_test
  group_column: trip_id
  evaluator_partition_enabled: false
validation:
  strategy: grouped_k_fold
  folds: 5
  primary_metric: macro_f1
models:
  compare:
    - logistic_regression
    - random_forest
    - hist_gradient_boosting
    - calibrated_linear_svm
    - small_mlp
  bayesian_search_model: hist_gradient_boosting
  bayesian_trials: 15
  bayesian_folds: 3
decoder:
  method: gap_aware_hmm_viterbi
  compare_classifier_only: true
  optimize_on: training_group_cv

